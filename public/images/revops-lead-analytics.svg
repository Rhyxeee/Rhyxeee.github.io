  <text x="820" y="320" fill="#f8fafc" font-size="60" font-weight="800" letter-spacing="-2">Lead Analytics</text>
  <rect x="820" y="356" width="620" height="2" fill="rgba(255,255,255,0.12)"/>
  <text x="820" y="410" fill="rgba(226,232,240,0.68)" font-size="27">From a messy CRM export to marketing ROI</text>
  <text x="820" y="446" fill="rgba(226,232,240,0.68)" font-size="27">and a data-driven call-first list.</text>

  <g font-size="23" font-weight="600">
    <rect x="820" y="500" width="210" height="50" rx="25" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.4)"/>
    <text x="925" y="533" fill="#38bdf8" text-anchor="middle">Data cleaning</text>
    <rect x="1046" y="500" width="120" height="50" rx="25" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)"/>
    <text x="1106" y="533" fill="#a855f7" text-anchor="middle">Funnel</text>
    <rect x="1182" y="500" width="90" height="50" rx="25" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)"/>
    <text x="1227" y="533" fill="#22c55e" text-anchor="middle">ROI</text>
    <rect x="820" y="566" width="300" height="50" rx="25" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)"/>
    <text x="970" y="599" fill="#f59e0b" text-anchor="middle">Dial prioritization</text>
    <rect x="1136" y="566" width="150" height="50" rx="25" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
