    <rect x="820" y="756" width="210" height="26" rx="6" fill="#22c55e" fill-opacity="0.8"/>
    <rect x="820" y="792" width="150" height="26" rx="6" fill="#22c55e" fill-opacity="0.6"/>
    <rect x="820" y="828" width="95"  height="26" rx="6" fill="#22c55e" fill-opacity="0.45"/>
  </g>

  <rect x="120" y="900" width="470" height="52" rx="26" fill="rgba(34,197,94,0.10)" stroke="rgba(34,197,94,0.35)"/>
  <text x="355" y="933" fill="#22c55e" font-size="22" font-weight="600" text-anchor="middle">Synthetic data · privacy-safe</text>
