<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1324"/><stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <radialGradient id="g" cx="0.3" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.14"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="430" cy="520" rx="420" ry="360" fill="url(#g)"/>

  <text x="120" y="180" fill="rgba(226,232,240,0.68)" font-size="26" letter-spacing="3">REVOPS · REAL ESTATE PIPELINE</text>
